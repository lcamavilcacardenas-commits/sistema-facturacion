# ----------------------------------------------------
# 1. CONFIGURACIÓN GENERAL (DEFAULT - Desarrollo Local)
# ----------------------------------------------------
spring.application.name=sistema
server.port=8080

# ----------------------------------------------------
# 2. CONFIGURACIÓN DE MYSQL
# ----------------------------------------------------
# Se conecta a la base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_facturacion?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# CAMBIA ESTO por tu contraseña real:
spring.datasource.password=

# ----------------------------------------------------
# 3. CONFIGURACIÓN DE JPA / HIBERNATE
# ----------------------------------------------------
# Estrategia de inicialización: 'update' actualiza las tablas sin borrar datos
spring.jpa.hibernate.ddl-auto=update

# Mostrar y formatear el SQL generado
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilita la advertencia 'open-in-view' y mejora el rendimiento
spring.jpa.open-in-view=false 

# Especificar el dialecto de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ----------------------------------------------------
# 4. CONFIGURACIÓN JWT
# ----------------------------------------------------
# CONFIGURACIÓN JWT: Clave Secreta VÁLIDA para desarrollo
jwt.secret=VGhpcy1pcy1hLVNwcmluZ2Jvb3QtSlh0LVNlY3JldC1LZXktZm9yLURldi1Qcm9qZWN0MjAyNQ==

# Tiempo de Expiración del Token (24 horas)
jwt.expiration=86400000